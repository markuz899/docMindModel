# Offline smoke-test model: a randomly initialised ~2M-param Qwen2 built by
# scripts/make_tiny_model.py. Produces garbage text on purpose -- it only
# proves the pipeline runs end-to-end without downloading 3 GB of weights.
base_model: artifacts/tiny-model
revision: null
trust_remote_code: false

max_seq_length: 1024
dtype: float32
device_map: cpu
attn_implementation: eager

quantization:
  enabled: false

lora:
  r: 4
  alpha: 8
  dropout: 0.0
  bias: none
  task_type: CAUSAL_LM
  target_modules: [q_proj, k_proj, v_proj, o_proj]
  modules_to_save: []

generation:
  max_new_tokens: 32
  temperature: 0.0
  top_p: 1.0
  repetition_penalty: 1.0

export:
  merged_dir: artifacts/export/smoke-merged
  gguf_dir: artifacts/export/smoke-gguf
  outtype: f16
  quantizations: [Q8_0]
  primary_quantization: Q8_0
