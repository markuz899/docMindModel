[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docmind-model"
version = "0.1.0"
description = "LoRA/QLoRA fine-tuning pipeline for grounded technical-documentation QA"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "torch>=2.2",
  "transformers>=4.44",
  "datasets>=2.20",
  "peft>=0.11",
  "accelerate>=0.33",
  "safetensors>=0.4",
  "pyyaml>=6.0",
  "pydantic>=2.6",
]

[project.optional-dependencies]
cuda = ["bitsandbytes>=0.43"]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.34"]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
